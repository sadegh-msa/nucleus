<div style="position:absolute;top: 0; right: 0;z-index:1000;">
  @if (htmlDir() === 'ltr') {
    <button (click)="htmlDir.set('rtl')" style="width: 100px; border: 1px solid gray;">RTL</button>
  } @else {
    <button (click)="htmlDir.set('ltr')" style="width: 100px; border: 1px solid gray;">LTR</button>
  }
</div>

<p-toast></p-toast>
