<section>
  <h4>Sliding</h4>
  <menu [fabMenuItems]="slidingMenuItems"
        [fabMenuSetStyleClass]="true"
        fabMenuSubmenuMode="sliding"
  ></menu>
</section>

<section>
  <h4>Floating</h4>
  <menu [fabMenuItems]="floatingMenuItems"
        [fabMenuSetStyleClass]="true"
  ></menu>
</section>

<section>
  <h4>Compact</h4>
  <menu [fabMenuItems]="compactMenuItems"
        [fabMenuSetStyleClass]="true"
        fabMenuMode="compact"
  ></menu>
</section>
