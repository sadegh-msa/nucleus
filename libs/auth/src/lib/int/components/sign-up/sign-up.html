<nu-auth-layout>
  <ng-container title i18n>Sign up</ng-container>

  <ng-container form>
    <form
      [id]="formId"
      class="ui form"
      autocomplete="off"
      (submit)="onSubmit($event)"
    >
      <fieldset
        uiFormField
        label="Email" i18n-label
        [fieldState]="form.email()"
      >
        <input
          class="ui input"
          placeholder="username@example.com"
          aria-describedby="email-help"
          spellcheck="false"
          [formField]="form.email"
        />
      </fieldset>

      <fieldset
        uiFormField
        label="Password" i18n-label
        [fieldState]="form.password()"
        [hint]="passwordHint()"
      >
        <input
          uiInputPassword
          placeholder="************"
          aria-describedby="password-help"
          spellcheck="false"
          [formField]="form.password"
          (strength)="passwordStrength.set($event)"
          [uiPopover]="passwordPopover"
          uiPopoverPlacement="block-start-inline-center"
          uiPopoverEvent="focus"
        />
      </fieldset>

      <fieldset
        uiFormField
        label="Confirm password" i18n-label
        [fieldState]="form.confirmPassword()"
        [hint]="confirmPasswordHint()"
      >
        <input
          uiInputPassword
          placeholder="************"
          aria-describedby="confirm-password-help"
          spellcheck="false"
          [formField]="form.confirmPassword"
          [passwordToConfirm]="form.password().value()"
          (confirm)="arePasswordsMatching.set($event)"
        />
      </fieldset>
    </form>
  </ng-container>

  <ng-container actions>
    <button
      class="ui button normal primary emphasis"
      [attr.form]="formId"
      (click)="form().markAsTouched()"
    >
      <svg uiSvgIcon="user" />
      <span i18n>Sign up</span>
    </button>

    <a
      class="ui button normal stamp basic"
      [routerLink]="['/', config.signIn.route.path]"
    >
      <svg uiSvgIcon="login" />
      <span i18n>Sign in</span>
    </a>

    <a
      class="ui button normal stamp basic"
      [routerLink]="['/', config.resetPassword.route.path]"
    >
      <svg uiSvgIcon="lock" />
      <span i18n>Forgot password?</span>
    </a>
  </ng-container>
</nu-auth-layout>

<ng-template #passwordPopover>
  @if(passwordStrength(); as ps) {
    <ui-password-checklist [fieldState]="form.password()" [passwordStrength]="ps" />
  }
</ng-template>
