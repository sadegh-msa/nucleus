<nu-generic-toolbar [toolbar]="toolbar()" />
@let hasInfoFields = infoFields().length > 0;
@let hasData = ((data() | keyvalue) || []).length > 0;

<menu class="toolbar-end">
  @if (hasInfoFields && hasData) {
    <li>
      <button class="ui button medium stamp basic second-info"
              (click)="infoOverlay.toggle($event)">
        <svg uiSvgIcon="info-circle" />
        <span i18n>Info</span>
      </button>

      <p-overlayPanel #infoOverlay
                      styleClass="info-fields-overlay">
        <nu-info-fields [infoFields]="infoFields()" [data]="data()" />
      </p-overlayPanel>
    </li>
  }
</menu>
