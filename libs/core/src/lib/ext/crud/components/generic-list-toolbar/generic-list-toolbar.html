<nu-generic-toolbar [toolbar]="toolbar()" />

<menu class="toolbar-end">
  @if (showPaginator()) {
    <li>
      <button uiRipple
              class="ui button nu-tool medium stamp basic"
              (click)="paginatorOverlay.toggle($event)"
      >
        <span>{{ paginatorLabel() }}</span>
      </button>

      <p-overlayPanel #paginatorOverlay
                      styleClass="generic-list-toolbar-paginator-overlay">
        <p-paginator (onPageChange)="paginate($event)"
                     [first]="pagination().first"
                     [rows]="pagination().rows"
                     [showJumpToPageDropdown]="true"
                     [showPageLinks]="false"
                     [totalRecords]="pagination().total" />
        <p-divider />
        <div class="paginator-rows-per-page">
          <span class="p-buttonset">
            @for (option of rowsPerPageOptions(); track option) {
              <button uiRipple
                class="ui button medium basic"
                [class.stamp]="option !== pagination().rows"
                [class.primary]="option === pagination().rows"
                (click)="paginate({rows: option, first: 0})"
              >
                <span>{{ option }}</span>
              </button>
            }
          </span>
        </div>
      </p-overlayPanel>
    </li>
  }
</menu>
