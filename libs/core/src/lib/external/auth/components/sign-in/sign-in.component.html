<nu-sign-layout>
  <ng-container title i18n>Sign in</ng-container>

  <ng-container form>
    <form id="sign-in-form" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
      <fab-form-field id="email-form-field"
                      label="Email" i18n-label
                      inputId="email"
                      help="Your email address"
                      [inputFormControl]="form.get('email')"
                      [messages]="{ required: 'Required', email: 'Invalid' }">
        <input id="email"
               class="fab input"
               placeholder="user@example.com"
               aria-describedby="email-help"
               spellcheck="false"
               formControlName="email" />
      </fab-form-field>

      <fab-form-field id="password-form-field"
                      label="Password" i18n-label
                      inputId="password"
                      [inputFormControl]="form.get('password')"
                      [messages]="{ required: 'Password is required' }">
        <input fabInputPassword
               id="password"
               placeholder="************"
               aria-describedby="password-help"
               spellcheck="false"
               formControlName="password" />
      </fab-form-field>

      <div id="remember-me-form-field" class="fab-form-field">
        <fab-checkbox label="Remember me" i18n-label
                      aria-describedby="remember-me-help"
                      formControlName="rememberMe" />
      </div>
    </form>
  </ng-container>

  <ng-container actions>
    <div class="nu-form-actions">
      <button id="sign-in-button"
              class="fab button primary emphasis"
              form="sign-in-form"
      >
        <svg-icon src="icons/outline/login.svg" />
        <span i18n>Sign in</span>
        <!--        [showLoading]="isSubmitting()"-->
      </button>

      <a id="sign-up-button"
         class="fab button stamp text"
         [routerLink]="['/', config.path.signUp]"
      >
        <svg-icon src="icons/outline/user.svg" />
        <span i18n>Create account</span>
      </a>

      <a id="forgot-password-button"
         class="fab button stamp text"
         [routerLink]="['/', config.path.forgotPassword]"
      >
        <svg-icon src="icons/outline/lock.svg" />
        <span i18n>Forgot password?</span>
      </a>
    </div>
  </ng-container>
</nu-sign-layout>
