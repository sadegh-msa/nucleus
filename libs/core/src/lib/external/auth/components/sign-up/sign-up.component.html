<nu-sign-layout>
  <ng-container title i18n>Sign up</ng-container>

  <ng-container form>
    <form id="sign-up-form" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
      <div id="email-form-field" class="fab-form-field">
        <div class="fab-form-field-text">
          <label for="email" i18n>Email</label>
          <span class="fab-form-field-message"></span>
        </div>
        <input id="email"
               class="fab input"
               placeholder="username@example.com"
               aria-describedby="email-help"
               spellcheck="false"
               formControlName="email" />
      </div>

      <div id="password-form-field" class="fab-form-field">
        <div class="fab-form-field-text">
          <label for="password" i18n>Password</label>
          <span class="fab-form-field-message"></span>
        </div>
        <input fabInputPassword
               id="password"
               type="password"
               placeholder="************"
               aria-describedby="password-help"
               spellcheck="false"
               formControlName="password"
               (strength)="onPasswordStrength($event)" />
      </div>

      <div id="confirm-password-form-field" class="fab-form-field">
        <div class="fab-form-field-text">
          <label for="confirm-password" i18n>Confirm password</label>
          <span class="fab-form-field-message">
<!--            {{ form.get('confirmPassword')?.hasError('passwordsDoNotMatch') }}-->
          </span>
        </div>
        <input fabInputPassword
               id="confirm-password"
               type="password"
               placeholder="************"
               aria-describedby="confirm-password-help"
               spellcheck="false"
               [class.invalid]="form.get('confirmPassword')?.hasError('passwordsDoNotMatch')"
               [class.dirty]="form.get('confirmPassword')?.dirty"
               [passwordToConfirm]="form.get('password')?.value"
               formControlName="confirmPassword" />
      </div>
    </form>
  </ng-container>

  <ng-container actions>
    <div class="nu-form-actions">
      <button id="sign-up-button"
              class="fab button primary emphasis"
              form="sign-up-form">
        <svg-icon src="icons/outline/user.svg" />
        <span i18n>Sign up</span>
        <!--        [showLoading]="isSubmitting()"-->
      </button>

      <a id="sign-in-button"
         class="fab button stamp text"
         [routerLink]="['/', config.path.signIn]">
        <svg-icon src="icons/outline/login.svg" />
        <span i18n>Sign in</span>
      </a>

      <a id="forgot-password-button"
         class="fab button stamp text"
         [routerLink]="['/', config.path.forgotPassword]">
        <svg-icon src="icons/outline/lock.svg" />
        <span i18n>Forgot password?</span>
      </a>
    </div>
  </ng-container>
</nu-sign-layout>
