<nu-generic-toolbar [toolbar]="toolbar()"></nu-generic-toolbar>
@let hasInfoFields = infoFields().length > 0;
@let hasData = (data() | keyvalue).length > 0;

<menu class="toolbar-end">
  @if (hasInfoFields && hasData) {
    <li>
      <button class="fab button medium stamp text second-info"
              (click)="infoOverlay.toggle($event)">
        <svg-icon src="icons/outline/info-circle.svg" />
        <span i18n>Info</span>
      </button>

      <p-overlayPanel #infoOverlay
                      styleClass="info-fields-overlay">
        <nu-info-fields [infoFields]="infoFields()" [data]="data()"></nu-info-fields>
      </p-overlayPanel>
    </li>
  }
</menu>
