<menu class="toolbar-start">
  @for (tool of toolbar().tools; track tool.key) {
    <li>
      @if (tool.element === ToolElement.Button) {
        <button #buttonElement
                (click)="runCommand(buttonElement, tool)"
                [pTooltip]="tool.tooltip || ''" tooltipPosition="bottom"
                [ngClass]="tool.styleClass || []"
                [disabled]="!!(tool.disabled && tool.disabled())"
                *permission="tool.permission">
          @if (tool.icon) {
            <svg-icon [src]="tool.icon" />
          }
          @if (tool.label) {
            <span>{{ tool.label }}</span>
          }
          <!--          [showLoading]="!!(tool.showLoading && tool.showLoading())"-->
        </button>

        @if (tool.confirm) {
          <p-confirmPopup [key]="tool.key"></p-confirmPopup>
        }
      } @else if (tool.element === ToolElement.Link) {
        <a [ngClass]="tool.styleClass || []"
           [title]="tool.tooltip || ''"
           [routerLink]="tool.command()"
           [state]="tool.routerStates ? tool.routerStates() : {}"
           [queryParams]="tool.routerQueryParams ? tool.routerQueryParams(): {}"
           *permission="tool.permission">
          @if (tool.icon) {
            <svg-icon [src]="tool.icon" />
          }
          @if (tool.label) {
            <span>{{ tool.label }}</span>
          }
          <!--          [showLoading]="!!(tool.showLoading && tool.showLoading())"-->
          <!--          [disabled]="!!(tool.disabled && tool.disabled())"-->
        </a>
      }
    </li>
  }
</menu>
