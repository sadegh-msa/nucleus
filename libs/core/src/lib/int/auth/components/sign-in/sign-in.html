<nu-sign-layout>
  <ng-container title i18n>Sign in</ng-container>

  <ng-container form>
    <form id="sign-in-form" (submit)="onSubmit($event)" autocomplete="off">
      <ui-form-field
        id="email-form-field"
        label="Email" i18n-label
        inputId="email"
        [fieldState]="form.email()"
      >
        <input
          id="email"
          class="ui input"
          placeholder="user@example.com"
          aria-describedby="email-help"
          spellcheck="false"
          [formField]="form.email"
        />
      </ui-form-field>

      <ui-form-field
        id="password-form-field"
        label="Password" i18n-label
        inputId="password"
        [fieldState]="form.password()"
      >
        <input uiInputPassword
          id="password"
          placeholder="************"
          aria-describedby="password-help"
          spellcheck="false"
          [formField]="form.password"
        />
      </ui-form-field>

      <ui-form-field
        id="remember-me-form-field"
        label="Remember me" i18n-label
        inputId="remember-me"
        [fieldState]="(form.rememberMe!)()"
      >
        <input uiCheckbox
          id="remember-me"
          type="checkbox"
          [formField]="form.rememberMe!"
        >
      </ui-form-field>
    </form>
  </ng-container>

  <ng-container actions>
    <div class="nu-form-actions">
      <button
        id="sign-in-button"
        class="ui button normal primary emphasis"
        form="sign-in-form"
        (click)="form().markAsTouched()"
      >
        <svg uiSvgIcon="login" />
        <span i18n>Sign in</span>
      </button>

      <a
        id="sign-up-button"
        class="ui button normal stamp basic"
        [routerLink]="['/', config.routes.signUp.path]"
      >
        <svg uiSvgIcon="user" />
        <span i18n>Create account</span>
      </a>

      <a
        id="reset-password-button"
        class="ui button normal stamp basic"
        [routerLink]="['/', config.routes.resetPassword.path]"
      >
        <svg uiSvgIcon="lock" />
        <span i18n>Forgot password?</span>
      </a>
    </div>
  </ng-container>
</nu-sign-layout>
