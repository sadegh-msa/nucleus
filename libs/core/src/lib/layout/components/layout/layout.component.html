<p-progressBar mode="determinate"
               [showValue]="false"
               [value]="progressValue()"
               [styleClass]="'p-progressbar-' + progressValue()"></p-progressBar>

<scr-layout-topbar>
  <ng-container toolbar>
    <ng-content select="[toolbar]"></ng-content>
  </ng-container>
</scr-layout-topbar>

<nav>
  <scr-layout-nav>
    <ng-container header>
      <ng-content select="[nav-header]"></ng-content>
    </ng-container>
  </scr-layout-nav>
</nav>


<main>
  <p-card class="layout-main">
    <ng-template pTemplate="header">&nbsp;</ng-template>
    <ng-template pTemplate="content">
      <ng-content select="[main]"></ng-content>
    </ng-template>
    <ng-template pTemplate="footer">&nbsp;</ng-template>
  </p-card>
</main>
