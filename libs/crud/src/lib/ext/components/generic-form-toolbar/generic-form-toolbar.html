<nu-generic-toolbar [toolbar]="toolbar()" />
@let hasInfoFields = infoFields().length;
@let hasData = ((data() | keyvalue) ?? []).length;

<menu class="toolbar-end">
  @if (hasInfoFields && hasData) {
    <li>
      <button uiRipple
        class="ui button medium stamp basic second-info"
        [uiPopover]="infoFieldsPopover"
        [uiPopoverData]="{data}"
        uiPopoverPlacement="block-end-edge-start"
      >
        <svg uiSvgIcon="info-circle" />
        <span i18n>Info</span>
      </button>
    </li>
  }
</menu>

<ng-template #infoFieldsPopover let-data="data">
  <nu-info-fields [infoFields]="infoFields()" [data]="data.data()" />
</ng-template>
