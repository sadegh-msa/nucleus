<menu class="toolbar-start">
  @for (tool of toolbar().tools; track tool.key) {
    <li>
      @if (tool.element === 'button') {
        <button #buttonElement
                uiRipple
                (click)="!tool.confirm && tool.command()"
                [uiTooltip]="tool.tooltip" uiTooltipPlacement="block-end-inline-center"
                [ngClass]="tool.ngClass ?? []"
                [disabled]="!!(tool.disabled && tool.disabled())"
                [uiPopover]="toolConfirmPopover"
                [uiPopoverData]="{tool}"
                [uiPopoverDisabled]="!tool.confirm"
                uiPopoverPlacement="block-end-inline-end"
                *permission="tool.permission">
          @if (tool.icon) {
            <svg [uiSvgIcon]="tool.icon" [variant]="tool.iconVariant" />
          }
          @if (tool.label) {
            <span>{{ tool.label }}</span>
          }
          <!--[showLoading]="!!(tool.showLoading && tool.showLoading())"-->
        </button>
      } @else if (tool.element === 'link') {
        <a uiRipple
           [ngClass]="tool.ngClass ?? []"
           [uiTooltip]="tool.tooltip" uiTooltipPlacement="block-end-inline-center"
           [routerLink]="tool.command()"
           [state]="tool.routerStates ? tool.routerStates() : {}"
           [queryParams]="tool.routerQueryParams ? tool.routerQueryParams(): {}"
           *permission="tool.permission">
          @if (tool.icon) {
            <svg [uiSvgIcon]="tool.icon" [variant]="tool.iconVariant" />
          }
          @if (tool.label) {
            <span>{{ tool.label }}</span>
          }
          <!--[showLoading]="!!(tool.showLoading && tool.showLoading())"-->
          <!--[disabled]="!!(tool.disabled && tool.disabled())"-->
        </a>
      }
    </li>
  }
</menu>


<ng-template #toolConfirmPopover let-control="control" let-data="data">
  <div class="tool-confirm">
    <p><strong>{{ data.tool.confirm }}</strong></p>
    <div class="actions">
      <button
        class="ui button small bulk danger"
        (click)="data.tool.command();control.close()"
      >
        <span i18n>Yes</span>
      </button>
      <button
        class="ui button small basic stamp"
        (click)="control.close()"
      >
        <span i18n>No</span>
      </button>
    </div>
  </div>
</ng-template>
