<article class="ui page page-form" [loading]="isBusy()">
  <nu-generic-form-toolbar
    [toolbar]="toolbar"
    [data]="data()"
    class="page-toolbar"
  />

  <article class="page-content">
    <form
      [id]="formId"
      class="ui form compact"
      autocomplete="off"
      [class.view]="pageType() === 'view'"
      (submit)="onSubmit($event)"
    >
      <fieldset
        uiFormField
        label="Title" i18n-label
        [fieldState]="form.title()"
      >
        <input
          class="ui input"
          aria-describedby="title-help"
          [formField]="form.title"
        />
      </fieldset>

      <fieldset
        uiFormField
        label="Code" i18n-label
        [fieldState]="form.code()"
      >
        <input
          class="ui input"
          aria-describedby="code-help"
          [formField]="form.code"
        />
      </fieldset>

      <fieldset
        uiFormField
        label="Date" i18n-label
        [fieldState]="form.date()"
      >
        <input
          class="ui input"
          aria-describedby="date-help"
          type="date"
          [formField]="form.date"
        />
      </fieldset>

      <fieldset
        uiFormField
        label="Description" i18n-label
        [fieldState]="form.description()"
      >
        <textarea
          class="ui textarea"
          placeholder="Description"
          aria-describedby="description-help"
          [formField]="form.description"
        ></textarea>
      </fieldset>
    </form>
  </article>
</article>
