<article class="ui page page-list">
  <nu-generic-list-toolbar [toolbar]="toolbar"
                                     [selectedRows]="selectedRows().size"
                                     [(pagination)]="pagination"
                                     class="page-toolbar" />

  <nu-generic-list [data]="data()"
                             [idField]="config.field.id"
                             [table]="table"
                             [firstRow]="pagination().first"
                             [showLoading]="isBusy()"
                             [isActivatable]="true"
                             selectionMode="multiple"
                             [selected]="selected"
                             [activated]="activated"
                             (activation)="onActivation($event)"
                             (selection)="onSelection($event)"
                             class="page-content" />
</article>
