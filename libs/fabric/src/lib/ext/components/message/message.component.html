@for (message of messages() | keyvalue; track message.key) {
  @let msg = message.value;

  <section [class]="`fab message ${msg.variant}`" @fade>
    <hgroup>
      <h4>
        {{ msg.title }}
      </h4>
      @if (msg.code) {
        <h6>
          ({{ msg.code }})
        </h6>
      }
    </hgroup>
    <p>{{ msg.content }}</p>
  </section>
}
