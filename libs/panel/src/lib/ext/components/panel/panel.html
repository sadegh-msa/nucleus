<progress max="100"
          [value]="progressValue()"
          [class]="`progress-${progressValue()}`"></progress>

@defer (when isNavVisible()) {
  <nav nu-panel-nav class="ui card no-padding">
    <ng-content select="[nav-body]" />

    <ng-container nav-footer>
      <ng-content select="[nav-footer]" />
    </ng-container>
  </nav>
}

<header nu-panel-header class="ui card no-padding horizontal">
  <ng-container toolbar>
    <ng-content select="[toolbar]" />
  </ng-container>
</header>

<main class="ui card no-padding">
  <ng-content />
</main>
