@let buttonStyleClass = 'ui button basic stamp small';

<a uiRipple
   routerLink="/"
   [class]="buttonStyleClass"
   class="home second-primary"
>
  <svg uiSvgIcon="home" class="bidi" />
</a>

@for (item of items(); track $index; let last = $last) {
  <svg uiSvgIcon="arrow-right-1" class="bidi small" />

  @if (!last && item.routerLink) {
    <a uiRipple
       [routerLink]="item.routerLink"
       [class]="buttonStyleClass"
       class="second-primary"
    >
      <span>{{ item.label }}</span>
    </a>
  } @else {
    <button uiRipple [class]="buttonStyleClass">
      <span>{{ item.label }}</span>
    </button>
  }
}
