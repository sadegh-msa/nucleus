<header>
  <a href="/" class="panel-nav-logo" [class]="navExtent()" target="_blank">
    <figure [style]="`--nav-logo-height:${logo().height}px;--nav-logo-width:${logo().width}px;`">
      @if (isNavWide()) {
        <img [@fade]="{value: 'leave', params: {delay: 500, duration: 0}}"
             [alt]="logo().alt"
             [height]="logo().height"
             [width]="logo().width"
             [ngSrc]="logo().src"
             priority>
      } @else {
        <img [@fade]="{value: 'enter', params: {delay: 0, duration: 500}}"
             [alt]="logo().alt"
             [height]="logo().height"
             [width]="logo().width"
             [ngSrc]="logo().src"
             priority>
      }
    </figure>
  </a>
</header>

<section class="content">
  <ng-content />
</section>

@if (breakpoints().isWeb) {
  <footer>
    <ng-content select="[nav-footer]" />
  </footer>

  <button fabRipple
          (click)="toggleNavMode()"
          class="fab button basic neutral second-ink small toggle"
          [ngClass]="navExtent()">
    <svg fabSvgIcon="arrow-left-1" class="bidi" />
  </button>
}
