@let logo = logoInfo();

<header>
  <a href="/" class="panel-nav-logo" [class]="navExtent()" target="_blank">
    <figure [style]="`--nav-logo-height:${logo.height}px;--nav-logo-width:${logo.width}px;`">
      @if(isNavWide()) {
        <img
          animate.leave="ui transition-delay-normal"
          [alt]="logo.alt"
          [height]="logo.height"
          [width]="logo.width"
          [ngSrc]="logo.src"
          priority>
      } @else {
        <img
          [alt]="logo.alt"
          [height]="logo.height"
          [width]="logo.width"
          [ngSrc]="logo.src"
          priority>
      }
    </figure>
  </a>
</header>

<section class="content">
  <ng-content />
</section>

@if (breakpoints().isWeb) {
  <footer>
    <ng-content select="[nav-footer]" />
  </footer>

  <button (click)="toggleNavMode()"
    class="ui button emphasis stamp tiny toggle"
    [ngClass]="navExtent()">
    <svg uiSvgIcon="arrow-left-1" class="bidi" />
  </button>
}
