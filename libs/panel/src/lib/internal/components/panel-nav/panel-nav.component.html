<header>
  <ng-container
    *ngTemplateOutlet="logo; context: {brand: branding.organization, type: 'organization'}">
  </ng-container>
</header>

<section class="subheader">
  <ng-content select="[subheader]" />
</section>

<menu [fabMenuItems]="mainMenu()"
      [fabMenuSetStyleClass]="true"
      [ngClass]="navMode()"
      [fabMenuMode]="navMode()"
      [fabMenuSubmenuMode]="navMode() === 'compact' ? 'floating' : 'sliding'"
></menu>

<footer>
  <menu [fabMenuItems]="footerMenu()"
        [fabMenuSetStyleClass]="true"
        [ngClass]="navMode()"
        [fabMenuMode]="navMode()"
        [fabMenuSubmenuMode]="navMode() === 'compact' ? 'floating' : 'sliding'"
  ></menu>
</footer>

<button (click)="toggleNavMode()"
        class="fab button text gray second-black medium toggle"
        [ngClass]="navMode()">
  <svg-icon src="icons/outline/arrow-left-1.svg" svgClass="bidi" />
</button>

<ng-template #logo let-brand="brand" let-type="type">
  <a [href]="brand.homePage" [class]="'nu panel-nav-' + type + '-logo'" target="_blank">
    @if (navMode() === 'wide') {
      <img @fadeDelayEnter
           [alt]="brand.title"
           [height]="brand.logo.hTitle.height"
           [width]="brand.logo.hTitle.width"
           [ngSrc]="brand.logo.hTitle.path"
           [style.minHeight]="brand.logo.hTitle.height"
           [style.minWidth]="brand.logo.hTitle.width"
           priority>
    } @else if (navMode() === 'compact') {
      <img @fadeDelayEnter
           [alt]="brand.title"
           [height]="brand.logo.noTitle.height"
           [width]="brand.logo.noTitle.width"
           [ngSrc]="brand.logo.noTitle.path"
           [style.minHeight]="brand.logo.noTitle.height"
           [style.minWidth]="brand.logo.noTitle.width"
           priority>
    }
  </a>
</ng-template>
