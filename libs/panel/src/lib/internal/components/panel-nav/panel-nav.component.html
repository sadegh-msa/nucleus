<header>
  <a routerLink="/">
    @if (navMode() === 'compact') {
      <img alt="Fabric"
           ngSrc="logo/logo-no-title.svg"
           height="40"
           width="40"
           class="logo-small"
           priority
           @fadeDelayEnter
      >
    } @else if (navMode() === 'wide') {
      <img alt="Fabric"
           ngSrc="logo/logo-h-title.svg"
           class="logo"
           height="55"
           width="140"
           priority
           @fadeDelayEnter
      >
    }
  </a>
</header>

<section class="subheader">
  <ng-content select="[subheader]" />
</section>

<menu [uiMenuItems]="mainMenu()"
      [uiMenuSetStyleClass]="true"
      [ngClass]="navMode()"
      [uiMenuMode]="navMode()"
      [uiMenuSubmenuMode]="navMode() === 'compact' ? 'floating' : 'sliding'"
></menu>

<footer>
  <menu [uiMenuItems]="footerMenu()"
        [uiMenuSetStyleClass]="true"
        [ngClass]="navMode()"
        [uiMenuMode]="navMode()"
        [uiMenuSubmenuMode]="navMode() === 'compact' ? 'floating' : 'sliding'"
  ></menu>
</footer>

<button (click)="toggleNavMode()"
        class="ui button text gray second-black medium toggle"
        [ngClass]="navMode()">
  <svg-icon src="icons/outline/arrow-left-1.svg" svgClass="bidi" />
</button>
