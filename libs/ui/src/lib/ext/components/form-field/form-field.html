<div class="ui-form-field-header">
  @if (label()) {
    <label [for]="inputId()">
      {{ label() }}
      @if(fieldState()?.required()) {
        *
      }
    </label>
  }

  @if (help()) {
    <i
      class="ui-form-field-help"
      [uiTooltip]="help()"
      [uiTooltipPlacement]="helpPlacement()"
      >?</i>
  }

  @let hintMessage = hint()?.message;
  @let hintStyleClass = hint()?.styleClass;
  @let errorMessage = error();

  @if (isTouched() && (errorMessage || hintMessage)) {
    <span class="ui-form-field-message" [class]="hintStyleClass">
      {{ errorMessage || hintMessage }}
    </span>
  }
</div>
<ng-content />
