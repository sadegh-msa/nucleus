<header>
  @if (label()) {
    <label [for]="inputId()">
      {{ label() }}
      @if(isRequired()) {
        *
      }
    </label>
  }

  @if (help()) {
    <i
      class="help"
      [uiTooltip]="help()"
      [uiTooltipPlacement]="helpPlacement()"
      >?</i>
  }

  @let hintMessage = hint()?.message;
  @let hintStyleClass = hint()?.styleClass;
  @let errorMessage = error();
  @let isMessageVisible = isDirty() || isTouched();

  @if (isMessageVisible && (errorMessage || hintMessage)) {
    <span class="message" [class]="hintStyleClass">
      {{ errorMessage || hintMessage }}
    </span>
  }
</header>
<ng-content />
