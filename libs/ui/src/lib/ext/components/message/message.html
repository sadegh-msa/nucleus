@for (message of messages() | keyvalue; track message.key) {
  @let msg = message.value;

  <section
    [class]="`ui message ${msg.variant}`"
    animate.enter="fade-in-normal"
    animate.leave="fade-out-normal"
  >
    <hgroup>
      <h5>
        {{ msg.title }}
      </h5>
      @if (msg.code) {
        <h6>({{ msg.code }})</h6>
      }
    </hgroup>
    <p>{{ msg.content }}</p>
  </section>
}
