<div class="ui-toggle-chassis"
     [ngClass]="{checked: isChecked(), disabled: isDisabled()}"
     (click)="toggle()">
    <span class="ui-toggle-switch">
      @if (hasCheckmark()) {
        <span class="ui-toggle-checkmark"></span>
      }
    </span>
</div>

@if (hasLabel()) {
  <label (click)="toggle()">
    {{ label() || (value()?.toString() | titlecase) }}
  </label>
}
