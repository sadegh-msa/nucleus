<div class="chassis"
  [ngClass]="{checked: isChecked(), disabled: isDisabled()}"
  (click)="toggle()"
>
  <span class="switch">
    @if (hasCheckmark()) {
      <span class="checkmark"></span>
    }
  </span>
</div>

@if (hasLabel()) {
  <label (click)="toggle()">
    {{ label() ?? (value()?.toString() | titlecase) }}
  </label>
}
